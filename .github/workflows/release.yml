name: release

# On merge to main: apply infrastructure, publish the site, then publish the traveler package as
# desired_release. CI never deploys the traveler into a region; the traveler adopts
# the new release at its next hop.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # The deploy role trusts only this environment, which only main may use.
    environment: production
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_github_repo: ${{ github.repository }}
      TF_VAR_github_oidc_subject_prefix: repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.6"

      # Everything third-party is installed before AWS credentials exist, and only the
      # pinned release set, not the dev tooling.
      - name: Build bundles
        run: |
          python -m venv .venv && .venv/bin/python -m pip install -q -r requirements-release.txt
          bash scripts/build-route-writer.sh
          bash scripts/build-watchdog.sh

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          mask-aws-account-id: true
          aws-region: us-east-2

      - name: Terraform apply
        run: |
          terraform -chdir=infra/terraform init -input=false \
            -backend-config="bucket=traveler-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          terraform -chdir=infra/terraform apply -input=false -auto-approve

      - name: Publish site
        run: |
          bucket=$(terraform -chdir=infra/terraform output -raw site_bucket)
          .venv/bin/python -m scripts.site_build build/site
          aws s3 sync build/site/ "s3://$bucket/" --exclude index.html --cache-control "public, max-age=31536000, immutable"
          aws s3 cp build/site/index.html "s3://$bucket/index.html" --cache-control "public, max-age=60"

      - name: Publish release
        run: .venv/bin/python -m scripts.ops release
