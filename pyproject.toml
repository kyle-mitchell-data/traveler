[project]
name = "traveler"
version = "0.2.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tower", "tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Randomness is seeded by hop ID on purpose, so stays and destinations are reproducible.
"traveler/lifecycle.py" = ["S311"]
"traveler/facts/*" = ["S311"]
"tests/*" = ["S311", "BLE001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["traveler", "tower", "scripts"]
